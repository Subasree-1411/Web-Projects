<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
        h1{
            margin-bottom:20px;
        }
        .moon_toogle{
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border:2px solid currentColor;
            cursor:pointer;
            transform: scale(2);
        }
        .moon_toogle::after{
            content:'';
            position: absolute;
            top: 0;
            left:50%;
            width:50%;
            height:100%;
            background-color: currentColor;
            border-radius: 0px 10px 10px 0px;
        }
        .lightmode{
            background-color:white;
            color: black;
        }
        .dark_mode{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="lightmode">
    <div class="box">
        <h1>Dark/Light Mode Toggle</h1>
        <div class="moon_toogle" onclick="toggle()"></div>
    </div>
<script>
    function toggle() {
        document.body.classList.toggle("dark_mode");
    }
</script>
</body>
</html>
