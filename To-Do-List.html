<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
    <style>
        body {
            background-color: rgba(152, 58, 192, 0);
            text-align: center;
            padding: 15px;
        }

        .container {
            background-color: rgb(151, 58, 192);
            width: 50%;
            height: 76vh;
            margin: 10px 340px;
            padding: 50px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 60%;
            background: white;
            border-radius: 7px;
            color: black;
            margin: 20px;
        }

        .todo-box {
            display: flex;
            width: 60%;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            margin-top: 20px auto;
        }

        input[type="text"] {
            position: relative;
            top: 15px;
            right: 20px;
            width: 200px;
            height: 35px;
            border: 1px solid #080606;
            font-size: 15px;
            border-radius: 5px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 10px 17px;
            margin-bottom: 10px;
            border-radius: 7px;
            color: black;
        }

        .btn {
            color: white;
            width: 80px;
            height: 35px;
            background-color: rgb(151, 58, 192);
            position: relative;
            top: 15px;
            border-radius: 5px;
        }

        .taskList {
            margin-top: 24px;
        }

        .task button {
            background-color: rgb(151, 58, 192);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .task button:hover {
            background-color: rgb(151, 58, 192);
        }

        legend {
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-align: left;
        }

        .stbox {
            width: 660px;
            height: 70px;
            text-align: center;
            background-color: white;
            border-radius: 5px;
            border: 1px solid white;
        }

        .List {
            width: 660px;
            text-align: center;
            background-color: white;
            border-radius: 5px;
            border: 1px solid white;

        }
        /* .task{
            border: 1px solid white;
            text-align: center;
            background-color: white;
            border-radius: 5px;



        } */
    </style>
</head>

<body>
    <div class="container">
        <fieldset class="border p-3 mb-5 bg-body rounded">
            <legend class="float-none">To Do List</legend>
            <div class="todo-box">
                <div class="stbox">
                    <input type="text" id="taskInput" placeholder="Enter a task">
                    <button onclick="addtask()" class="btn">Add</button>
                </div>
            </div>
            <br>
            <div id="taskList" class="List"></div>
    </div>
    </fieldset>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        function addtask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();
            if (taskText == "") return;
            const taskDiv = document.createElement("div");
            taskDiv.className = "task";
            const taskSpan = document.createElement("span");
            taskSpan.textContent = taskText;
            const deletebtn = document.createElement("button");
            deletebtn.innerHTML = "🗑️"
            deletebtn.onclick = () => taskDiv.remove();
            taskDiv.appendChild(taskSpan);
            taskDiv.appendChild(deletebtn);
            document.getElementById("taskList").appendChild(taskDiv);
        }
    </script>
</body>

</html>
