<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive SideBar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .main {
            width: 100%;
            height: 587px;
            background-color: rgba(137, 43, 226, 0.457);
            display: flex;
            flex-direction: row;
            /* row -> sidebar and content side by side, image la irundhu maadhiri */
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            height: 100%;
            background-color: white;
            display: flex;
            justify-content: flex-start;
            flex-direction: column;
            align-items: stretch;
            flex-shrink: 0;
            /* margin-right and fixed 700px height neekiten, adhu layout ah break pannuchu */
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: black;
            font-size: 38px;
            font-weight: bold;
            margin-left: 30px;
            margin-top: 19px;
        }

        p {
            color: rgb(0, 0, 0);
            font-size: 18px;
            text-transform: uppercase;
            margin: 0;
            padding: 20px 0 20px 30px;
            /* padding increase pannen - konjam line space kidaikum */
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background-color 0.2s ease, color 0.2s ease, padding 0.2s ease;
            /* smooth ah color mாறும் */
        }

        p i {
            margin-right: 12px;
            width: 18px;
            text-align: center;
            color: rgb(30, 48, 80);
            --fa-primary-color: rgb(30, 48, 80);
            --fa-secondary-color: rgb(30, 48, 80);
            transition: color 0.2s ease, --fa-primary-color 0.2s ease, --fa-secondary-color 0.2s ease;
        }

        p:hover,
        p.active {
            background-color: rgb(142, 92, 216);
            color: white;
        }

        p:hover i,
        p.active i {
            color: white;
            --fa-primary-color: white;
            --fa-secondary-color: white;
        }

        h1 {
            color: rgb(142, 92, 216);
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin: 0;
        }

        @media screen and (max-width:600px) {
            .sidebar {
                width: 70px;
            }

            .sidebar h2 {
                display: none;
                /* "Menu" text hide */
            }

            p {
                justify-content: center;
                padding: 18px 0;
                font-size: 20px;
            }

            p i {
                margin-right: 0;
            }

            .label {
                display: none;
            }

            h1 {
                font-size: 26px;
                padding: 20px 10px;
            }
        }

        @media screen and (max-width:400px) {
            .sidebar {
                width: 55px;
            }

            p {
                font-size: 16px;
                padding: 14px 0;
            }

            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="sidebar">
            <h2>Menu</h2>
            <p class="active">
                <i class="fa-duotone fa-solid fa-tachograph-digital"></i>
                <span class="label">Dashboard</span>
            </p>
            <p>
                <i class="fa-duotone fa-solid fa-keyboard"></i>
                <span class="label">Shortcuts</span>
            </p>
            <p>
                <i class="fa-duotone fa-solid fa-eye"></i>
                <span class="label">Overview</span>
            </p>
            <p>
                <i class="fa-duotone fa-solid fa-calendar"></i>
                <span class="label">Events</span>
            </p>
            <p>
                <i class="fa-duotone fa-solid fa-info-circle"></i>
                <span class="label">About</span>
            </p>
            <p>
                <i class="fa-duotone fa-solid fa-cogs"></i>
                <span class="label">Services</span>
            </p>
            <p>
                <i class="fa-regular fa-envelope"></i>
                <span class="label">Contact</span>
            </p>
        </div>
        <div class="content">
            <h1>SIDE BAR IN CSS</h1>
        </div>
    </div>
</body>

</html>
