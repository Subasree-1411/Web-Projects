<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
            overflow-y: hidden;
        }

        .main {
            width: 600px;
            height: 580px;
            background-image: url("./bus-removebg-preview.png");
            border: 2px solid black;
            line-break: anywhere;
            margin-left: 300px;
        }

        input,
        label {
            width: 220px;
            height: 25px;
            margin-left: 17px;
            border-radius: 5px;
        }

        select {
            width: 220px;
            height: 25px;
            margin-left: 17px;
            border-radius: 5px;
        }

        button {
            width: 220px;
            height: 28px;
            color: black;
            border-radius: 9px;
            background-color: #009dff;
            margin-left: 17px;
            border-radius: 5px;
        }


        #result {
            width: 250px;
            height: 250px;
            color: black;
            /* background-color: white; */
            backdrop-filter: blur(10px);
            box-shadow: 2px 2px 14px black;
            border-radius: 13px;
            position: relative;
            left: 335px;
            bottom: 450px;
            font-size: 20px;
        }

        h2 {
            position: relative;
            right: 255px;
            top: 20px;
            font-size: 30px;

        }

        h3 {
            position: relative;
            right: 340px;
            top: 60px;
            font-size: 23px;

        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Bus Ticket <br>Booking</h1>
        <label for="busname"><b>Enter Bus Name:</b></label><br>
        <input type="text" id="busname" placeholder="Bus Name"><br><br>
        <label for="age"><b>Enter Your age:</b></label><br>
        <input type="number" placeholder="Age"><br><br>
        <label for=""><b>Select Bus Route</b></label><br>
        <select name="Route" id="route">
            <option value="default">Route</option>
            <option value="Trichy-Chennai">Trichy-Chennai</option>
            <option value="Madurai-Chennai">Madurai-Chennai</option>
            <option value="Salem-Coibatore">Salem-Coimbatore</option>
            <option value="Chennai-Salem">Chennai-Salem</option>
        </select><br><br>
        <label for=""><b>Select Seat Type</b></label><br>
        <select name="Seat" id="seattype">
            <option value="Seat">Seat Type</option>
            <option value="500">Regular Seat(₹500)</option>
            <option value="700">Premium Seat(₹700)</option>
            <option value="1000">VIP Seat(₹1000)</option>
        </select><br><br>
        <label for=""><b>Select Bus Type</b></label><br>
        <select name="Bus" id="bustype">
            <option value="100">A/C Bus (+100)</option>
            <option value="0">Non A/C</option>
        </select><br><br>
        <label for=""><b>Enter Number of Tickets:</b></label><br>
        <input type="number" id="count"><br><br>
        <button type="button" onclick="ticket()">Submit</button>
        <div id="result"></div>

    </div>
    <h2>Status</h2>
    <h3><u>Booking Summary</u></h3><br><br>
    <script>
        function ticket() {
            var busname = String(document.getElementById("busname").value)
            var seattype = Number(document.getElementById("seattype").value)
            var bustype = Number(document.getElementById("bustype").value)
            var route = document.getElementById("route").value
            var count = Number(document.getElementById("count").value)
            var result = document.getElementById("result")
            var a = (seattype + bustype) * count
            if (route == "Trichy-Chennai") {
                a = (400 + bustype) * count;
            }
            else if (route == "Madurai-Chennai") {
                a = (480 + bustype) * count;
            }
            else if (route == "Salem-Coibatore") {
                a = (550 + bustype) * count;
            }
            else if (route == "Chennai-Salem") {
                a = (600 + bustype) * count;
            }
            result.innerHTML = `<br><br>
<b>Bus Name :</b> ${busname}<br><br>
<b>Bus Route :</b> ${route}<br><br>
<b>Total Price :</b> ₹${a.toFixed(2)}
`;
        }
    </script>
</body>

</html>
