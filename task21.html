<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 700px;
            height: 400px;
            border: none;
            background-color: aquamarine;
            margin-left: 400px;
            margin-top: 150px;
        }

        button {
            width: 200px;
            height: 60px;
            box-shadow: 2px 2px 15px black;
            border-radius: 8px;
            background-color: white;
            position: relative;
            left: 250px;
            font-size: 20px;
            font-weight: bold;
            top: 170px;
        }

        h1 {
            color: black;
            text-align: center;
            position: relative;
            left: 30px;
            top: 120px;
        }
    </style>
</head>

<body class="box">
    <div class="color">
        <h1>Random Background Color Change</h1>
        <button onclick="changeColor()">Change Color</button>
    </div>
    <script>
        function changeColor() {
            let a = "0123456789ABCDEF";
            let n = "#";
            for (let i = 0; i < 6; i++) {
                n += a.charAt(Math.random()*16);
            }
            document.body.style.backgroundColor = n;
        }
    </script>
</body>

</html>
