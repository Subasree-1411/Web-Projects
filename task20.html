<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 700px;
            height: 450px;
            margin-left: 400px;
            margin-top: 130px;
            background-color: #14a55da5;
            border: 0.5px solid black;
        }
        .box1{
            width: 400px;
            height: 100px;
            font-size: 50px;
            text-align: center;
            padding-top:60px;
            background-color: rgb(3, 76, 3);
            border: 3px solid white;
            border-radius: 14px;
            letter-spacing: 10px;
            color: white;
            position: relative;
            left: 150px;
            top: 70px;
        }
        button{
            color: white;
            text-align: center;
            font-size: 20px;
            background-color: #1018b6b7;
            border: none;
            letter-spacing: 2px;
            width: 350px;
            height: 60px;
            background-color: #1018b6b7;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 2px 2px 15px black;
            position: relative;
            top: 120px;
            left: 180px;
        }
        
    </style>
</head>
<body>
    <div class="main">
        <div class="box1"></div>
        <div class="box2">
            <button onclick="captcha()">Generate New Captcha</button>
        </div>
    </div>
    <script>
        function captcha(){
            const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxtz0123456789";
            let a="";
            for(let i=0;i<6;i++){
                a+=chars.charAt(Math.floor(Math.random()*chars.length));
            }
            document.getElementsByClassName("box1")[0].innerHTML=a;
        }
    </script>
    
</body>
</html>
