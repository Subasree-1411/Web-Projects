<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .main {
            width: 890px;
            height: 70vh;
            border: 2.5px solid black;
            display: flex;
            flex-direction: row;
            margin-left: 150px;
            margin-top: 50px;
        }
        .User {
            width: 290px;
            height: 360px;
            background-color: rgba(0, 128, 81, 0.728);
            border-radius: 10px;
            margin: 24px 0px 0px 24px;
        }
        h1 {
            color: white;
            font-size: 40px;
            font-weight: bold;
            margin-left: 30px;
            margin-top: 30px;
        }
        h5 {
            color: white;
            font-size: 20px;
            position: relative;
            bottom: 30px;
            left: 29px
        }
        .operator {
            width: 250px;
            height: 140px;
            background-color: white;
            position: relative;
            left: 20px;
            bottom: 55px;
            border-radius: 19px;
            background-image: url('./operator-removebg-preview.png')
        }
        h2 {
            color: rgba(0, 0, 0, 0.386);
            font-size: 40px;
            position: relative;
            left: 50px;
            top: 50px;
        }
        p {
            color: black;
            font-size: 45px;
            position: relative;
            left: 50px;
            bottom: 25px;
        }
        input {
            width: 160px;
            height: 45px;
            border: 0.5px;
            border-radius: 8px;
            position: relative;
            left: 50px;
            bottom: 50px;
            font-family: 'Times New Roman', Times, serif;
            color: grey;
            background-color: rgba(128, 128, 128, 0.368);
        }
        button {
            width: 170px;
            height: 50px;
            background-color: rgba(0, 128, 81, 0.728);
            border-radius: 8px;
            position: relative;
            bottom: 20px;
            left: 140px;
            font-size: 20px;
            color: white;
        }
        .out {
            width: 450px;
            height: 110px;
            background-color: rgba(128, 128, 128, 0.368);
            border-radius: 8px;
            position: relative;
            left: 50px;
        }
        h3 {
            color: grey;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            position: relative;
            left: 15px;
            top: 10px;
        }
        i {
            color: white;
            font-size: 35px;
            position: relative;
            bottom: 50px;
            left: 20px;
        }
    </style>
</head>
<body>
    <script>
        function add() {
            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;
            var output = parseInt(num1) + parseInt(num2);
            document.getElementById("output").innerHTML = output;
            // <p id="output"></p>
        }
    </script>
    <div class="main">
        <div class="User">
            <h1>COMBINE</h1>
            <h5>Two User Input</h5>
            <span>
                <i class="fa-solid fa-user" style="color: hsl(0, 0%, 100%);"></i>
                <i class="fa-solid fa-plus" style="color: hsl(0, 0%, 100%) ; "></i>
                <i class="fa-solid fa-user" style="color: hsl(0, 0%, 100%);"></i>
                <i class="fa-solid fa-equals" style="color: hsl(0, 0%, 100%);"></i>
                <i class="fa-solid fa-user-group" style="color: hsl(0, 0%, 100%);"></i>
            </span>
            <div class="operator">
                <h2>Operators</h2>
            </div>
        </div>
        <div>
            <p>Input Here</p>
            <div class="in">
                <input type="number" id="num1" placeholder="       First Input">
                <input type="number" id="num2" placeholder="   Second Input">
            </div>
            <div>
                <button onclick="add()">SUBMIT</button>
            </div>
            <div class="out">
                <h3>Output:</h3>
                <p id="output"></p>
            </div>
        </div>
    </div>
</body>
</html>
