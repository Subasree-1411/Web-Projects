<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            width: 90%;
            height: 500px;
            display: flex;
            background-color: rgba(128, 128, 128, 0.167);
            border: 1px solid black;
            justify-content: center;
            padding: 50px 70px;
        }

        .box {
            width: 1000px;
            height: 500px;
            border-radius: 16px;
            background-color: aliceblue;
        }

        .head {
            width: 390px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.632);
            color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 3px 3px 10px black;
            font-family: 'Times New Roman', Times, serif;
            margin-left: 230px;
            letter-spacing: 2px;
            margin-top: 50px;
            font-size: 25px;
            padding-left: 30px;
            padding-top: 20px;
        }
        label {
            position: relative;
            left: 240px;
            top: 20px;
            font-size: 23px;
        }
        input{
            width: 400px;
            height: 35px;
            border-radius: 8px;
            position: relative;
            left: 240px;
            background-color: #80808045;
            top: 20px;
            font-size: 23px;
        }
        button{
            width:270px;
            height: 40px;
            border-radius: 7px;
            background-color: #005eff;
            color: white;
            text-align: center;
            letter-spacing: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            position: relative;
            left: 315px;
            top: 25px;
        }
        #result{
            width: 400px;
            height: 100px;
            border-radius: 10px;
            background-color: #008cffa9;
            color: black;
            position: relative;
            left: 240px;
            top: 60px;
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <div class="head">
                Alphabetical Sorting...
            </div>
            <label for=""><b>Enter a String</b></label><br><br>
            <input type="text" id="str" placeholder="Focus on The goOd tHInGs"><br><br>
            <button type="button" onclick="rearrange()">CALCULATE</button>
            <!-- <div class="output"></div> -->
            <div id="result"></div>
        </div>
    </div>
    <script>
        function rearrange(){
        let str = document.getElementById("str").value;
        let result = document.getElementById("result")

    let arrange = {};
    let lower = "";
    let upper = "";

    for (let ch of str) {
        {
           if(ch>='a' && ch<='z')
        {
            lower+=ch;
        } 
        else if(ch>='A' && ch<='Z')
        {   
            upper+=ch
        }
        }
    }

    document.getElementById("result").innerHTML = lower + upper
        
}

    </script>
</body>

</html>
