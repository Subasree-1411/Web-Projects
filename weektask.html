<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Text Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .static-text {
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .typewriter {
            color: white;
            font-size: clamp(22px, 4.5vw, 45px);
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            min-height: 55px;
        }
        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }
        @media (max-width: 600px) {
            .static-text {
                font-size: 32px;
            }

            .typewriter {
                font-size: 30px;
                min-height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="typewriter">
            <span id="text"></span>
        </div>
    </div>
    <script>
        const text = ["I Love Programming","I Love Full Stack","I Love Data Analytics"];
        const textElement = document.getElementById("text");
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingSpeed = 100;
        const deletingSpeed = 60;
        const pauseTyping = 1500;
        const pauseDeleting = 500;
        function typeWriter() 
        {
            const currentText = text[textIndex];
            if (!isDeleting) 
            {
                textElement.textContent =currentText.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === currentText.length) 
                {
                    isDeleting = true;
                    setTimeout(typeWriter, pauseTyping);
                    return;
                }
                setTimeout(typeWriter, typingSpeed);
            } 
            else 
            {
                textElement.textContent =currentText.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) 
                {
                    isDeleting = false;
                    textIndex++;
                    if (textIndex === text.length)
                    {
                        textIndex = 0;
                    }
                    setTimeout(typeWriter, pauseDeleting);
                    return;
                }
                setTimeout(typeWriter, deletingSpeed);
            }
        }
        typeWriter();
    </script>
</body>
</html>
