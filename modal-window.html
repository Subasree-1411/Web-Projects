<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background-image:
                linear-gradient( rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=85");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }
        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 80px;
        }
        .login-box {
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            box-shadow:0 15px 40px rgba(0, 0, 0, 0.35);
            transition: filter 0.3s ease;
        }
        .login-box h2 {
            font-weight: 600;
        }
        .form-control {
            height: 45px;
            border-radius: 8px;
            border: none;
        }
        .form-control:focus {
            box-shadow:0 0 0 3px rgba(255,255,255,0.25);
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 50px;
        }
        .password-container input::-ms-reveal,
        .password-container input::-ms-clear {
            display: none;
        }
        .password-container input::-webkit-textfield-decoration-container {
            display: none;
        }
        .password-container input::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            right: 0;
        }
        .password-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            background: transparent;
            color: #555;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .password-eye:hover {
            color: #000;
        }
        .login-btn {
            height: 45px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow:0 5px 15px rgba(0,0,0,0.25);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .message-box {
            width: 300px;
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            text-align: center;
            box-shadow:0 20px 50px rgba(0,0,0,0.45);
            animation: popup 0.4s ease;
        }
        @keyframes popup {
            0% {
                opacity: 0;
                transform:translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform:translateY(0) scale(1);
            }
        }
        .status-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .success-icon {
            background: #198754;
            color: #ffffff;
        }
        .error-icon {
            background: #dc3545;
            color: #ffffff;
        }
        .message-box h3 {
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .message-box p {
            margin-bottom: 20px;
            color: #777;
            font-size: 14px;
        }
        .modal-btn {
            width: 100%;
            height: 42px;
            border-radius: 20px;
            font-weight: 600;
            border: none;
        }
        .modal-btn.success-btn {
            background: #198754;
            color: white;
        }
        .modal-btn.error-btn {
            background: #dc3545;
            color: white;
        }
        .success-input {
            border: 2px solid #198754 !important;
            background-color: #f0fff4;
            animation: smileEffect 0.5s ease;
        }
        @keyframes smileEffect {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
            100% {
                transform: scale(1);
            }
        }
        .error-input {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            50% {
                transform: translateX(6px);
            }
            75% {
                transform: translateX(-6px);
            }
            100% {
                transform: translateX(0);
            }
        }
        .login-box.dimmed {
            filter: blur(2px) brightness(0.7);
        }
        .error-checkbox {
            outline: 2px solid #dc3545;
            outline-offset: 2px;
        }
        @media (max-width: 500px) {
            .login-box {
                width: 90%;
                padding: 25px;
            }
            .message-box {
                width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="page" id="loginPage">
        <div class="login-box" id="loginBox">
            <h2 class="text-center mb-4">Login</h2>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email" >
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-control"            placeholder="Enter password" autocomplete="off">
                    <button type="button" class="password-eye" onclick="togglePassword()" 
                        aria-label="Show or hide password">
                        <i class="bi bi-eye" id="eyeIcon" ></i>
                    </button>
                </div>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="check">
                <label class="form-check-label" for="check" >Check me out</label>

            </div>


            <!-- =================================
                 LOGIN BUTTON
            ================================== -->

            <button
                type="button"
                class="btn btn-dark w-100 login-btn"
                onclick="login()"
            >
                Login
            </button>

        </div>

    </div>


    <!-- =====================================
         MODAL
    ===================================== -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div class="message-box">


            <div
                id="statusIcon"
                class="status-icon"
            ></div>


            <h3 id="messageTitle"></h3>


            <p id="messageText"></p>


            <button
                type="button"
                id="modalBtn"
                class="modal-btn"
                onclick="closeModal()"
            ></button>

        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>


        /* =====================================
           SHOW / HIDE PASSWORD
        ===================================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                /* SHOW PASSWORD */

                password.type = "text";

                eyeIcon.className =
                    "bi bi-eye-slash";

            }

            else {

                /* HIDE PASSWORD */

                password.type = "password";

                eyeIcon.className =
                    "bi bi-eye";

            }

        }


        /* =====================================
           LOGIN FUNCTION
        ===================================== */

        function login() {

            const email =
                document.getElementById("email");

            const password =
                document.getElementById("password");

            const checkbox =
                document.getElementById("check");

            const loginBox =
                document.getElementById("loginBox");

            const modalOverlay =
                document.getElementById("modalOverlay");

            const statusIcon =
                document.getElementById("statusIcon");

            const messageTitle =
                document.getElementById("messageTitle");

            const messageText =
                document.getElementById("messageText");

            const modalBtn =
                document.getElementById("modalBtn");


            /* Remove old styles */

            email.classList.remove(
                "success-input",
                "error-input"
            );


            password.classList.remove(
                "success-input",
                "error-input"
            );


            checkbox.classList.remove(
                "error-checkbox"
            );


            let hasError = false;


            /* =================================
               EMAIL VALIDATION
            ================================== */

            if (
                email.value.trim() === "" ||
                !email.checkValidity()
            ) {

                email.classList.add(
                    "error-input"
                );

                hasError = true;

            }


            /* =================================
               PASSWORD VALIDATION
            ================================== */

            if (
                password.value.trim() === ""
            ) {

                password.classList.add(
                    "error-input"
                );

                hasError = true;

            }


            /* =================================
               CHECKBOX VALIDATION
            ================================== */

            if (!checkbox.checked) {

                checkbox.classList.add(
                    "error-checkbox"
                );

                hasError = true;

            }


            /* =================================
               ERROR MESSAGE
            ================================== */

            if (hasError) {

                loginBox.classList.add(
                    "dimmed"
                );


                modalOverlay.classList.add(
                    "show"
                );


                statusIcon.innerHTML =
                    '<i class="bi bi-exclamation-circle"></i>';


                statusIcon.className =
                    "status-icon error-icon";


                messageTitle.innerHTML =
                    "ERROR!";


                messageTitle.className =
                    "text-danger";


                messageText.innerHTML =
                    "Please enter a valid email, password and check the box.";


                modalBtn.innerHTML =
                    "Try Again";


                modalBtn.className =
                    "modal-btn error-btn";


                return;

            }


            /* =================================
               SUCCESS
            ================================== */

            email.classList.add(
                "success-input"
            );


            password.classList.add(
                "success-input"
            );


            loginBox.classList.add(
                "dimmed"
            );


            modalOverlay.classList.add(
                "show"
            );


            statusIcon.innerHTML =
                '<i class="bi bi-check-lg"></i>';


            statusIcon.className =
                "status-icon success-icon";


            messageTitle.innerHTML =
                "SUCCESS!";


            messageTitle.className =
                "text-success";


            messageText.innerHTML =
                "Login successful. Welcome to T4TEQ...";


            modalBtn.innerHTML =
                "CONTINUE";


            modalBtn.className =
                "modal-btn success-btn";

        }


        /* =====================================
           CLOSE MODAL
        ===================================== */

        function closeModal() {

            document
                .getElementById("modalOverlay")
                .classList.remove("show");


            document
                .getElementById("loginBox")
                .classList.remove("dimmed");


            document
                .getElementById("email")
                .value = "";


            document
                .getElementById("password")
                .value = "";


            document
                .getElementById("check")
                .checked = false;


            document
                .getElementById("email")
                .classList.remove(
                    "success-input",
                    "error-input"
                );


            document
                .getElementById("password")
                .classList.remove(
                    "success-input",
                    "error-input"
                );


            document
                .getElementById("check")
                .classList.remove(
                    "error-checkbox"
                );


            /* Reset password */

            document
                .getElementById("password")
                .type = "password";


            /* Reset to ONE eye icon */

            document
                .getElementById("eyeIcon")
                .className = "bi bi-eye";

        }

    </script>

</body>
</html>
